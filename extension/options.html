<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName"></title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 data-i18n="extName"></h1>
      <button id="newSnippet" class="primary" type="button" data-i18n="newSnippet"></button>
    </header>
    <p id="pageError" class="status status-error page-error" role="alert" hidden></p>
    <div class="layout">
      <nav class="nav" data-i18n-aria-label="navLabel">
        <a href="#snippets" data-view="snippets"><span data-i18n="snippets"></span> <span id="snippetCount" class="nav-count"></span></a>
        <a href="#deleted" data-view="deleted"><span data-i18n="recentlyDeleted"></span> <span id="deletedCount" class="nav-count"></span></a>
        <a href="#settings" data-view="settings" data-i18n="settingsAndBackup"></a>
      </nav>

      <section id="view-snippets" class="view view-snippets" hidden>
        <div class="list-pane">
          <input id="search" class="input" type="search" data-i18n-placeholder="searchManagerPlaceholder" autocomplete="off" spellcheck="false" />
          <div id="folderBar" class="folders" role="tablist" data-i18n-aria-label="foldersLabel" hidden></div>
          <div id="folderActions" class="folder-actions" hidden>
            <div id="folderButtons" class="folder-buttons">
              <button id="renameFolder" class="secondary" type="button" data-i18n="renameFolder"></button>
              <button id="removeFolder" class="secondary" type="button" data-i18n="removeFolder"></button>
            </div>
            <form id="renameForm" class="rename-form" novalidate hidden>
              <div class="rename-row">
                <input id="renameInput" class="input rename-input" dir="auto" type="text" data-i18n-aria-label="folderNameLabel" autocomplete="off" />
                <button id="renameApply" class="primary" type="submit" data-i18n="rename"></button>
                <button id="renameCancel" class="secondary" type="button" data-i18n="cancel"></button>
              </div>
              <p id="renameHint" class="muted rename-hint" hidden></p>
              <p id="renameError" class="field-error" hidden></p>
            </form>
          </div>
          <ol id="snippetList" class="snippet-list" role="listbox" data-i18n-aria-label="snippets"></ol>
          <p id="moveStatus" class="sr-only" role="status"></p>
          <p id="listEmpty" class="muted" data-i18n="noSnippets" hidden></p>
          <div id="undoBar" class="undo" role="status" hidden>
            <span data-i18n="undoDeleted"></span>
            <button id="undoButton" class="secondary" type="button" data-i18n="undo"></button>
          </div>
        </div>

        <div class="editor-pane">
          <p id="editorEmpty" class="muted" data-i18n="selectOrNew"></p>
          <form id="editor" class="editor" hidden novalidate>
            <div id="editorNotice" class="notice" role="status" hidden>
              <span id="editorNoticeText"></span>
              <span class="notice-actions">
                <button id="noticePrimary" class="secondary" type="button"></button>
                <button id="noticeSecondary" class="secondary" type="button"></button>
              </span>
            </div>
            <h2 id="editorHeading"></h2>
            <label class="field">
              <span class="field-label" data-i18n="fieldName"></span>
              <input id="title" class="input" dir="auto" type="text" data-i18n-placeholder="optionalPlaceholder" autocomplete="off" />
            </label>
            <p id="titleError" class="field-error" hidden></p>
            <label class="field">
              <span class="field-label" data-i18n="fieldAbbreviation"></span>
              <input id="abbreviation" class="input" dir="ltr" type="text" data-i18n-placeholder="optionalAbbreviationPlaceholder" autocomplete="off" spellcheck="false" />
            </label>
            <p id="abbreviationError" class="field-error" hidden></p>
            <label class="field">
              <span class="field-label" data-i18n="fieldFolder"></span>
              <input id="folder" class="input" dir="auto" type="text" data-i18n-placeholder="optionalFolderPlaceholder" autocomplete="off" list="folderOptions" />
            </label>
            <p id="folderError" class="field-error" hidden></p>
            <datalist id="folderOptions"></datalist>
            <div class="field field-grow">
              <div class="field-head">
                <label id="contentLabel" class="field-label" for="content" data-i18n="fieldText"></label>
                <span class="field-tools">
                  <button id="formatJson" class="secondary small" type="button" aria-describedby="contentError" data-i18n="formatJson"></button>
                  <label class="inline-check"><input id="formatted" type="checkbox" /> <span data-i18n="formattedText"></span></label>
                </span>
              </div>
              <div id="toolbar" class="toolbar" role="toolbar" data-i18n-aria-label="toolbarLabel" aria-controls="richContent" hidden>
                <button class="tool" type="button" data-tool="bold" data-i18n-aria-label="toolBold" data-i18n-title="toolBold" aria-pressed="false"><b aria-hidden="true">B</b></button>
                <button class="tool" type="button" data-tool="italic" data-i18n-aria-label="toolItalic" data-i18n-title="toolItalic" aria-pressed="false"><i aria-hidden="true">I</i></button>
                <button class="tool" type="button" data-tool="underline" data-i18n-aria-label="toolUnderline" data-i18n-title="toolUnderline" aria-pressed="false"><u aria-hidden="true">U</u></button>
                <span class="tool-separator" aria-hidden="true"></span>
                <button class="tool" type="button" data-tool="link" data-i18n-aria-label="toolLink" data-i18n-title="toolLink"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 9.5l3-3"/><path d="M7.3 4.7l1.2-1.2a2.6 2.6 0 0 1 3.7 3.7L11 8.4"/><path d="M8.7 11.3l-1.2 1.2a2.6 2.6 0 0 1-3.7-3.7L5 7.6"/></svg></button>
                <span class="tool-separator" aria-hidden="true"></span>
                <button class="tool" type="button" data-tool="bulleted" data-i18n-aria-label="toolBulleted" data-i18n-title="toolBulleted" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 4.5h7M6.5 8h7M6.5 11.5h7"/><path d="M3 4.5h.01M3 8h.01M3 11.5h.01" stroke-width="2.2"/></svg></button>
                <button class="tool" type="button" data-tool="numbered" data-i18n-aria-label="toolNumbered" data-i18n-title="toolNumbered" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5h7M6.5 8h7M6.5 11.5h7"/><path d="M2.5 3.5l1-.6v3.1"/><path d="M2.4 9.6c.3-.5 1.8-.6 1.8.3 0 .7-1.8 1.4-1.8 2.1h1.9"/></svg></button>
                <span class="tool-separator" aria-hidden="true"></span>
                <button class="tool" type="button" data-tool="code" data-i18n-aria-label="toolCode" data-i18n-title="toolCode" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 5L2.5 8l3 3M10.5 5l3 3-3 3"/></svg></button>
                <button class="tool" type="button" data-tool="codeBlock" data-i18n-aria-label="toolCodeBlock" data-i18n-title="toolCodeBlock" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6.2 6.3L4.5 8l1.7 1.7M9.8 6.3L11.5 8l-1.7 1.7"/></svg></button>
                <span class="tool-separator" aria-hidden="true"></span>
                <button class="tool" type="button" data-tool="clear" data-i18n-aria-label="toolClear" data-i18n-title="toolClear"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 3.5h8M8 3.5v9"/><path d="M3 13.5l10-10"/></svg></button>
                <select id="codeLanguage" class="tool-select" data-i18n-aria-label="codeLanguageLabel" data-i18n-title="codeLanguageLabel" disabled>
                  <option value="" data-i18n="languagePlain"></option>
                  <option value="json">JSON</option>
                  <option value="javascript">JavaScript</option>
                  <option value="typescript">TypeScript</option>
                  <option value="python">Python</option>
                  <option value="html">HTML</option>
                  <option value="css">CSS</option>
                  <option value="sql">SQL</option>
                  <option value="shell">Shell</option>
                </select>
              </div>
              <div id="linkBar" class="link-bar" hidden>
                <label for="linkUrl" data-i18n="linkAddress"></label>
                <input id="linkUrl" class="input link-input" aria-describedby="linkError" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false" />
                <button id="linkApply" class="primary" type="button" data-i18n="apply"></button>
                <button id="linkRemove" class="secondary" type="button" data-i18n="removeLink"></button>
                <button id="linkCancel" class="secondary" type="button" data-i18n="cancel"></button>
              </div>
              <p id="linkError" class="field-error" role="alert" hidden></p>
              <textarea id="content" class="input content" dir="auto" spellcheck="true"></textarea>
              <div id="richContent" class="input content rich" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="contentLabel" dir="auto" spellcheck="true" hidden></div>
              <p id="formatHint" class="muted format-hint" data-i18n="formatHint" hidden></p>
            </div>
            <p id="contentError" class="field-error" role="alert" hidden></p>
            <p id="placeholderList" class="placeholder-list" hidden></p>
            <p id="unrecognizedList" class="placeholder-list" hidden></p>
            <p id="referenceList" class="placeholder-list" hidden></p>
            <div id="referenceProblems" hidden></div>
            <div class="editor-footer">
              <span id="count" class="muted"></span>
              <span class="spacer"></span>
              <button id="duplicate" class="secondary" type="button" data-i18n="duplicate"></button>
              <button id="delete" class="secondary danger" type="button" data-i18n="delete"></button>
              <button id="save" class="primary" type="submit" data-i18n="save"></button>
            </div>
            <p id="editorStatus" class="status" role="status"></p>
          </form>
        </div>
      </section>

      <section id="view-deleted" class="view view-page" hidden>
        <h2 data-i18n="recentlyDeleted"></h2>
        <p class="muted" data-i18n="deletedNote"></p>
        <ol id="deletedList" class="deleted-list"></ol>
        <p id="deletedEmpty" class="muted" data-i18n="nothingDeleted" hidden></p>
      </section>

      <section id="view-settings" class="view view-page" hidden>
        <h2 data-i18n="settings"></h2>
        <div class="setting">
          <label for="hotkey" class="setting-label" data-i18n="openPanelWith"></label>
          <select id="hotkey">
            <option value="Control" data-i18n="hotkeyControl"></option>
            <option value="Shift" data-i18n="hotkeyShift"></option>
            <option value="Alt" data-i18n="hotkeyAlt"></option>
            <option value="off" data-i18n="off"></option>
          </select>
          <p id="status" class="status" role="status"></p>
        </div>
        <div class="setting">
          <span class="setting-label" data-i18n="keyboardShortcut"></span>
          <div class="setting-row">
            <span id="shortcut" class="pill shortcut"></span>
            <button id="shortcutButton" class="secondary" type="button" data-i18n="changeShortcut"></button>
          </div>
          <p class="muted" data-i18n="shortcutNote"></p>
        </div>
        <div class="setting">
          <label class="setting-label" for="abbreviations" data-i18n="expandAbbreviations"></label>
          <select id="abbreviations">
            <option value="immediate" data-i18n="abbreviationsImmediate"></option>
            <option value="delimiter" data-i18n="abbreviationsDelimiter"></option>
            <option value="off" data-i18n="off"></option>
          </select>
          <p class="muted" data-i18n-rich="abbreviationsNote"></p>
        </div>
        <div class="setting">
          <span id="offSitesLabel" class="setting-label" data-i18n="offSitesLabel"></span>
          <form id="offSiteForm" class="setting-row">
            <input id="offSiteInput" class="input" type="text" placeholder="example.com" data-i18n-aria-label="offSiteInputLabel" autocomplete="off" spellcheck="false" />
            <button class="secondary" type="submit" data-i18n="addSite"></button>
          </form>
          <p id="offSiteError" class="field-error" hidden></p>
          <ul id="offSiteList" class="site-list" aria-labelledby="offSitesLabel"></ul>
          <p id="offSitesEmpty" class="muted" data-i18n="offSitesNone"></p>
          <p class="muted" data-i18n="offSitesNote"></p>
        </div>
        <p class="muted" data-i18n-rich="usageNote"></p>

        <h2 data-i18n="backup"></h2>
        <div class="setting setting-row">
          <button id="export" class="secondary" type="button" data-i18n="exportSnippets"></button>
          <span id="exportNote" class="muted"></span>
        </div>
        <div class="setting setting-row">
          <button id="import" class="secondary" type="button" data-i18n="importSnippets"></button>
          <span class="muted" data-i18n="importNote"></span>
          <input id="importFile" type="file" accept=".json,application/json" hidden />
        </div>
        <p id="importResult" class="status" role="status"></p>

        <h2 data-i18n="support"></h2>
        <p class="muted" data-i18n="supportNote"></p>
        <p>
          <a id="donate" class="donate" href="https://ko-fi.com/commitmaster102" target="_blank" rel="noopener noreferrer" data-i18n="donate"></a>
        </p>
      </section>
    </div>
    <script src="lib/i18n.js"></script>
    <script src="lib/snippets.js"></script>
    <script src="lib/placeholders.js"></script>
    <script src="lib/richtext.js"></script>
    <script src="lib/json-format.js"></script>
    <script src="lib/prism-setup.js"></script>
    <script src="vendor/prism/prism-core.js"></script>
    <script src="vendor/prism/prism-markup.js"></script>
    <script src="vendor/prism/prism-css.js"></script>
    <script src="vendor/prism/prism-css-extras.js"></script>
    <script src="vendor/prism/prism-clike.js"></script>
    <script src="vendor/prism/prism-javascript.js"></script>
    <script src="vendor/prism/prism-typescript.js"></script>
    <script src="vendor/prism/prism-json.js"></script>
    <script src="vendor/prism/prism-python.js"></script>
    <script src="vendor/prism/prism-sql.js"></script>
    <script src="vendor/prism/prism-bash.js"></script>
    <script src="lib/highlight.js"></script>
    <script src="options.js"></script>
  </body>
</html>
